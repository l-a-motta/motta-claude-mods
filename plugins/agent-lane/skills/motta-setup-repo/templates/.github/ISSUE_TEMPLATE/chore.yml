name: '🔧 Chore / Tech debt'
description: Maintenance, refactors, dependency updates
title: 'chore: '
type: Task
labels: ['type: chore', 'needs-triage']
projects: ['{{OWNER}}/{{PROJECT_NUMBER}}']
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What gets worse if we don't do this?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
{{AREA_OPTIONS}}
    validations:
      required: true
